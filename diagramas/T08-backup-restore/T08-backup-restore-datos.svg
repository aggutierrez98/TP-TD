<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="549px" preserveAspectRatio="none" style="width:466px;height:549px;background:#FFFFFF;" version="1.1" viewBox="0 0 466 549" width="466px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="430.2334" x="14.8044" y="24.5332">T08 - Gestion de Backup y Restauracion de Base de Datos - DER</text></g><!--class Bitacora--><g class="entity" data-qualified-name="Bitacora" data-source-line="9" id="ent0001"><rect fill="#F1F1F1" height="206.4844" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="287.8506" x="85" y="45.6094"/><ellipse cx="198.9961" cy="61.6094" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M197.8555,62.4063 L197.8555,64.9063 L202.1836,64.9063 L202.1836,63.9844 Q202.1836,63.375 202.418,63.1094 Q202.668,62.8438 203.043,62.8438 Q203.418,62.8438 203.6523,63.1094 Q203.8867,63.375 203.8867,63.9844 L203.8867,66.6094 L195.8867,66.6094 Q195.2617,66.6094 194.9961,66.375 Q194.7461,66.1406 194.7461,65.75 Q194.7461,65.375 195.0117,65.1406 Q195.2773,64.9063 195.8867,64.9063 L196.1523,64.9063 L196.1523,58.25 L195.8867,58.25 Q195.2617,58.25 194.9961,58.0156 Q194.7461,57.7813 194.7461,57.3906 Q194.7461,57.0156 194.9961,56.7813 Q195.2617,56.5469 195.8867,56.5469 L203.5117,56.5469 L203.5117,59.1406 Q203.5117,59.75 203.2773,60.0156 Q203.0586,60.2656 202.668,60.2656 Q202.293,60.2656 202.0586,60.0156 Q201.8242,59.75 201.8242,59.1406 L201.8242,58.25 L197.8555,58.25 L197.8555,60.7031 L199.3398,60.7031 Q199.3398,60.0469 199.4648,59.8594 Q199.7305,59.4531 200.1992,59.4531 Q200.5742,59.4531 200.8086,59.7188 Q201.043,59.9688 201.043,60.5781 L201.043,62.5469 Q201.043,63.0938 200.918,63.2813 Q200.6523,63.6719 200.1992,63.6719 Q199.7305,63.6719 199.4648,63.2656 Q199.3398,63.0781 199.3398,62.4063 L197.8555,62.4063 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3584" x="219.4961" y="67.3379">Bitacora</text><line style="stroke:#181818;stroke-width:0.5;" x1="86" x2="371.8506" y1="77.6094" y2="77.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="230.2891" x="91" y="96.1426">*Id : int &#171;PK, IDENTITY, NOT NULL&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="86" x2="371.8506" y1="103.2188" y2="103.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="223.3164" x="91" y="121.752">FechaHora : datetime &#171;NOT NULL&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="275.8506" x="91" y="139.3613">UsuarioId : int &lt;&lt;FK -&gt; Usuarios.Id, NULL&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262.2402" x="91" y="156.9707">UsernameSnapshot : varchar(50) &#171;NULL&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="236.5371" x="91" y="174.5801">Actividad : varchar(100) &#171;NOT NULL&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.4336" x="91" y="192.1895">Informacion : varchar(500) &#171;NULL&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.0615" x="91" y="209.7988">Nivel : varchar(20) &#171;NOT NULL&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.751" x="91" y="227.4082">Origen : varchar(100) &#171;NOT NULL&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="263.751" x="91" y="245.0176">EsTecnica : bit &#171;NOT NULL, DEFAULT 0&#187;</text></g><g class="entity" data-qualified-name="GMN2" data-source-line="23" id="ent0003"><path d="M6,311.6094 L6,534.1797 A0,0 0 0 0 6,534.1797 L451.8423,534.1797 A0,0 0 0 0 451.8423,534.1797 L451.8423,321.6094 L441.8423,311.6094 L233,311.6094 L229,251.8494 L225,311.6094 L6,311.6094 A0,0 0 0 0 6,311.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M441.8423,311.6094 L441.8423,321.6094 L451.8423,321.6094 L441.8423,311.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.5259" x="12" y="330.1045">T08 no tiene tabla propia: no persiste metadata de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8633" x="12" y="346.4561">backups (ni rutas de archivos .bak, ni fechas, ni</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.604" x="12" y="362.8076">historial de operaciones) en ninguna tabla de la base.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.0596" x="12" y="379.1592">El archivo .bak elegido por el administrador es la unica</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.4858" x="12" y="395.5107">persistencia del backup en si, fuera de la base de datos.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="12" y="411.8623">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.8213" x="12" y="428.2139">La unica relacion de T08 con el modelo de datos es de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.8296" x="12" y="444.5654">escritura: BackupBLL registra en Bitacora (via IBitacoraBLL)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.0913" x="12" y="460.917">un evento por cada CrearBackup/RestaurarBackup, exitoso o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.4458" x="12" y="477.2686">fallido (Actividad = "BackupCreated"/"BackupRestored" o su</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="330.6113" x="12" y="493.6201">variante de fallo, EsTecnica = 1 ante fallo tecnico de SQL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="424.8423" x="12" y="509.9717">Server). Mismo criterio documentado en T03 (T03-encriptado-datos.puml)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4624" x="12" y="526.3232">para modulos tecnicos sin tabla propia.</text></g><?plantuml-src XLHDRzD04BtxLunwIf2JfY0a5BML-WbHGmfDUk2ujYV9gFQkjRjEQH7_dJVE1wuuSB6zi_FUVBrnb5WoBKQVQ42VEKHnbWgcIvC_DJMzq0Difl4cFrm4rlUrYIu0Sttpa2HhWQNYk7P5s1v2PCykljGSal0ajZRUL9I1TULTOuihLpfFpsk9tBdFInF2HOnUiYRo97TsBgzCeuvBM9l2FOjTqTAKWPE4RPJuGaUN4atkl3aY4sX_e5y9qRj9GMCI6-dqzDjTIfFhczbYilYHqkn-GRF7wVJy76w30HwtdA_D5qMEgJ2HerGCs1l7nz0OBwx3Udj7W_EzFGmdHThrPczDnNDhwh1s4Q2DyOZYUnz7VUNUUrxaKJPIcABZSZBQ-dJZJ-pI-MexaIxPMxQPRBZitB__b-ZUouhjVwBTX0NdLdBjI2QnSvrY-BSNZzC5ZU3vEqciYqoPYz5Lv9Q78O14zMKTHM7B54rM6ggzgyMCrLop3mB5g8GCkcuWC82oLeE1UbR8Dn5ZXR0qKzb0UiFCFAM4gwMEBEWdC6lmE2-cL5y7uhPD7Fg4GYraqrYpIm0EU6RGyr3BBFVKBJDnoIifa1jaYZwQeX8BRW_rmH0KscXN0DsdRtDHrdANk4OCajAoGHQTQFfPwFOC4u2dEnxoN1wMJDi5yMlWoe7H7J0QkcqEXznBn6AETxjwEPs2OzNcgA4FAz3R8At9_WYtFk0Do3TOdMs1ERfELvwDtt8TxxT-Tqw9VmgYEtB0Ol5ARKtlhs3Fi7-jfv94BewETsSbSXu6SXGQW24rCJQsNL0YbtOKTaOdr5wsDnHRSrly_FiKu3dx3Vl-aBvAg1nf1nWRHuNBcmhLO3XQ-cBqWNfu330IBxMQ1zkErqrLQldwBz7MDYLQkWiJC2txHfn3_5mAKbKdVm00?></g></svg>